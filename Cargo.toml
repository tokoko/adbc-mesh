[workspace]
resolver = "2"
members = ["crates/proto", "crates/sidecar", "crates/driver"]

[workspace.dependencies]
adbc_core = "0.22.0"
adbc_ffi = "0.22.0"
adbc_driver_manager = "0.22.0"
arrow-array = { version = "57", features = ["ffi"] }
arrow-buffer = "57"
arrow-data = "57"
arrow-ipc = "57"
arrow-schema = "57"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
