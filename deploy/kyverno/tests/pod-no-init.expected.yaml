apiVersion: v1
kind: Pod
metadata:
    labels:
        adbc-mesh.io/backend: postgres
    name: consumer-no-init
    namespace: relay-test
spec:
    automountServiceAccountToken: false
    containers:
        - image: python:3.12-slim
          name: app
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /run/adbc-mesh
              name: relay-socket
    enableServiceLinks: false
    initContainers:
        - args:
            - /etc/adbc-mesh/config.json
          image: relay-sidecar:dev
          imagePullPolicy: IfNotPresent
          name: relay-sidecar
          resources:
            limits:
                memory: 1Gi
            requests:
                cpu: 100m
                memory: 128Mi
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1337
            runAsNonRoot: true
            runAsUser: 1337
            seccompProfile:
                type: RuntimeDefault
          startupProbe:
            exec:
                command:
                    - test
                    - -S
                    - /run/adbc-mesh/postgres.sock
            failureThreshold: 60
            periodSeconds: 1
          volumeMounts:
            - mountPath: /run/adbc-mesh
              name: relay-socket
            - mountPath: /etc/adbc-mesh
              name: relay-secret
              readOnly: true
            - mountPath: /var/run/secrets/adbc-mesh
              name: relay-token
              readOnly: true
    volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: relay-socket
        - name: relay-secret
          secret:
            defaultMode: 292
            secretName: adbc-mesh-postgres
        - name: relay-token
          projected:
            sources:
                - serviceAccountToken:
                    audience: vault
                    expirationSeconds: 3600
                    path: token

